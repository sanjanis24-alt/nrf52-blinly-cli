name: Zephyr Blinky CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-zephyr:
    runs-on: ubuntu-latest

    # Use the official Zephyr container with pre-installed toolchains
    container:
      image: ghcr.io/zephyrproject-rtos/ci:v0.26.8

    steps:
      # Step 1: Check out your repository
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          path: app

      # Step 2: Initialize west using upstream Zephyr (shallow clone for speed)
      - name: Initialize West Workspace
        run: |
          west init -m https://github.com/zephyrproject-rtos/zephyr --mr v3.7.0 workspace
          cd workspace
          west update --narrow -o=--depth=1 hal_nordic cmsis

      # Step 3: Compile your blinky app for nRF52 DK
      # Change 'nrf52dk/nrf52832' to 'nrf52840dk/nrf52840' if you use the 52840 DK
      - name: Build Firmware with West
        run: |
          cd workspace
          west build -b nrf52dk/nrf52832 ../app -- -DOVERLAY_CONFIG=""

      # Step 4: Archive output .hex and .bin artifacts
      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nrf52-blinky-firmware
          path: |
            workspace/build/zephyr/zephyr.hex
            workspace/build/zephyr/zephyr.bin
          retention-days: 7